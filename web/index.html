<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Справочник по Саудовской Аравии: локации, аренда, услуги и объявления из телеграм-каналов — без дублей, по категориям.">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131311" media="(prefers-color-scheme: dark)">
<title>Справочник по Саудии</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<a class="skip" href="#results">Перейти к результатам</a>

<header class="header">
  <div class="header__bar">
    <a class="brand" href="/" aria-label="На главную">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/>
          <circle cx="12" cy="10" r="2.6"/>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__title">Справочник</span>
        <span class="brand__sub">по Саудии</span>
      </span>
    </a>

    <form class="search" role="search" onsubmit="return false">
      <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
      </svg>
      <input id="search" type="search" autocomplete="off"
             placeholder="Найти место, район, услугу…" aria-label="Поиск по справочнику">
      <button type="button" id="search-clear" class="search__clear" hidden aria-label="Очистить поиск">✕</button>
    </form>
  </div>

  <nav class="rail" id="categories" aria-label="Категории"></nav>
</header>

<main class="page">
  <div class="filters" id="filters" hidden>
    <div class="filters__group" id="cities-group" hidden>
      <span class="filters__label">Город</span>
      <div class="chips" id="cities"></div>
    </div>
    <div class="filters__group" id="subcategories-group" hidden>
      <span class="filters__label">Тип</span>
      <div class="chips" id="subcategories"></div>
    </div>
  </div>

  <div class="summary">
    <p class="summary__count" id="count" aria-live="polite"></p>
    <button type="button" class="reset" id="reset" hidden>Сбросить фильтры</button>
  </div>

  <section id="results" class="grid" aria-label="Карточки справочника"></section>

  <div class="loadmore">
    <button type="button" id="more" class="button" hidden>Показать ещё</button>
  </div>

  <p class="empty" id="empty" hidden>
    <strong>Ничего не нашлось.</strong>
    Попробуйте другой запрос или снимите часть фильтров.
  </p>
</main>

<footer class="footer">
  <p>Карточки собраны из открытых телеграм-каналов. На каждой — ссылка на исходный пост.</p>
</footer>

<aside class="panel" id="panel" hidden aria-modal="true" role="dialog" aria-labelledby="panel-title">
  <div class="panel__backdrop" data-close></div>
  <article class="panel__sheet">
    <button type="button" class="panel__close" data-close aria-label="Закрыть">✕</button>
    <div class="panel__body" id="panel-body"></div>
  </article>
</aside>

<script src="/app.js"></script>
</body>
</html>
