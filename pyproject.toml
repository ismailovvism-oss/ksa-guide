[project]
name = "ksa-guide"
version = "0.1.0"
description = "Справочник по Саудии: агрегатор объявлений из Telegram-каналов без дублей"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "rapidfuzz>=3.10",
    "pillow>=11.0",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
