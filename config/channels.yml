# Каналы-источники. Впиши сюда те, из которых собираем объявления.
#
#   username — имя канала без @ (из ссылки t.me/<username>)
#   trust    — 0..100. Когда одно объявление пришло из нескольких каналов,
#              текст и фото для карточки берутся у канала с наибольшим trust.
#              Ставь выше тем, кто пишет аккуратно и не перевирает цены.
#   enabled  — false, чтобы временно выключить канал, не удаляя строку.

channels:
